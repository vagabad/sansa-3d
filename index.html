<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관음사 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#15181b; --panel:rgba(21,24,27,.84); --line:rgba(239,232,216,.16);
  --paper:#efe8d8; --muted:#b8ae98; --green:#2f7d6d; --red:#b8412c; --gold:#d9a441;
  --serif:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;font-family:var(--sans)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;font:500 13px/1 var(--serif);color:var(--paper);
  background:rgba(21,24,27,.72);border:1px solid rgba(217,164,65,.55);border-radius:3px;padding:5px 8px;white-space:nowrap;letter-spacing:.04em}
.lbl::after{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:6px;background:rgba(217,164,65,.8)}
.lbl:hover,.lbl:focus-visible{background:var(--red);outline:none}
#title{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;max-width:calc(100% - 32px);pointer-events:none}
#title .eb{font:500 11px/1 var(--sans);letter-spacing:.22em;color:var(--gold);text-shadow:0 1px 6px rgba(0,0,0,.6)}
#title h1{margin:6px 0 4px;font:700 26px/1.1 var(--serif);letter-spacing:.06em;text-shadow:0 1px 8px rgba(0,0,0,.5)}
#title p{margin:0;font-size:12px;color:var(--paper);opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#info{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:min(380px,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--green);padding:12px 14px;border-radius:2px;backdrop-filter:blur(6px)}
#info h2{margin:0 0 6px;font:700 17px/1.2 var(--serif);letter-spacing:.05em}
#info p{margin:0;font-size:13px;line-height:1.65;color:#ded6c3;text-wrap:pretty}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;gap:10px;align-items:center;background:linear-gradient(to top,rgba(21,24,27,.9),rgba(21,24,27,0))}
#views{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
#views::-webkit-scrollbar{display:none}
.tog{display:flex;gap:6px;flex:none}
button.b{font:500 13px/1 var(--sans);color:var(--paper);background:rgba(21,24,27,.78);border:1px solid var(--line);
  border-radius:2px;padding:9px 12px;cursor:pointer;white-space:nowrap}
button.b:hover{border-color:rgba(217,164,65,.7)}
button.b:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.b[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
#pad{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px}
#pad button{width:48px;height:48px;padding:0;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
#pad .up{grid-column:2;grid-row:1}#pad .lt{grid-column:1;grid-row:2}#pad .dn{grid-column:2;grid-row:2}#pad .rt{grid-column:3;grid-row:2}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:16px;text-align:center;font-size:14px;color:var(--muted)}
@media (max-width:560px){
  #title h1{font-size:21px}
  #info{bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:calc(100% - 32px - 170px);min-width:150px;padding:10px 12px}
  #info p{font-size:12px;line-height:1.55}
  #info.full{width:calc(100% - 32px)}
}
@media (prefers-reduced-motion:reduce){#fade{transition:none}}
</style>

</head><body><canvas id="c" tabindex="0" aria-label="관음사 3D 장면"></canvas>
<div id="labels"></div>
<header id="title">
  <div class="eb">강릉포교당 · 3D 모형</div>
  <h1>강릉포교당 관음사</h1>
  <p id="hint">드래그 회전 · 휠/핀치 확대 · Shift+드래그 이동</p>
</header>
<section id="info" class="full"><h2 id="iName">전경</h2><p id="iText"></p></section>
<div id="pad" hidden>
  <button class="b up" data-k="w" aria-label="앞으로">▲</button>
  <button class="b lt" data-k="arrowleft" aria-label="왼쪽으로 돌기">◀</button>
  <button class="b dn" data-k="s" aria-label="뒤로">▼</button>
  <button class="b rt" data-k="arrowright" aria-label="오른쪽으로 돌기">▶</button>
</div>
<nav id="bar">
  <div id="views"></div>
  <div class="tog">
    <button class="b" id="modeBtn" aria-pressed="false">걷기</button>
    <button class="b" id="timeBtn" aria-pressed="false">저녁</button>
  </div>
</nav>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div id="err">3D 라이브러리를 불러오지 못했습니다. 새로고침해 주세요.</div>');return;}
const T=THREE;
const canvas=document.getElementById('c');
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:true});}catch(e){document.body.insertAdjacentHTML('beforeend','<div id="err">이 브라우저에서 WebGL을 쓸 수 없습니다.</div>');return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(58,1,0.2,1000);
scene.fog=new T.Fog(0xcfdcea,120,420);

/* ---------- helpers ---------- */
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const redraw=[],cityMats=[];
function ctex(w,h,draw,rep,late){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=4;if(rep)t.repeat.set(rep[0],rep[1]);t._c=c;t._draw=draw;if(late)redraw.push(t);return t;}
function speckle(g,w,h,n,cols,a){for(let i=0;i<n;i++){g.fillStyle=cols[(rnd()*cols.length)|0];g.globalAlpha=a*rnd();const s=1+rnd()*3;g.fillRect(rnd()*w,rnd()*h,s,s);}g.globalAlpha=1;}
const std=o=>new T.MeshStandardMaterial(Object.assign({roughness:.85,metalness:0},o));
const SERIF='"Noto Serif KR","Noto Serif CJK KR",serif',SANS='"Noto Sans KR","Malgun Gothic",sans-serif';

/* ---------- textures ---------- */
const tileTex=ctex(128,128,(g,w,h)=>{g.fillStyle='#34393d';g.fillRect(0,0,w,h);
  for(let i=0;i<8;i++){const x=i*16,gr=g.createLinearGradient(x,0,x+16,0);gr.addColorStop(0,'#1f2225');gr.addColorStop(.5,'#565c61');gr.addColorStop(1,'#1f2225');g.fillStyle=gr;g.fillRect(x+1,0,14,h);}
  g.fillStyle='rgba(0,0,0,.3)';for(let j=0;j<4;j++)g.fillRect(0,j*32,w,3);});
const dcTex=ctex(256,64,(g,w,h)=>{g.fillStyle='#2f7d6d';g.fillRect(0,0,w,h);g.fillStyle='#1f4f6e';g.fillRect(0,0,w,6);g.fillRect(0,h-6,w,6);
  for(const cx of [0,128,256]){['#b8412c','#efe8d8','#1f4f6e','#d9a441','#b8412c'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.ellipse(cx,h/2,30-i*6,23-i*4.3,0,0,Math.PI*2);g.fill();});}
  g.strokeStyle='#efe8d8';g.lineWidth=2;for(const s of [40,168])for(let x=s;x<s+50;x+=8){g.beginPath();g.moveTo(x,9);g.lineTo(x,h-9);g.stroke();}});
const brTex=ctex(64,64,(g,w,h)=>{g.fillStyle='#2f7d6d';g.fillRect(0,0,w,h);g.fillStyle='#b8412c';g.fillRect(0,0,w,12);g.fillStyle='#efe8d8';g.fillRect(0,12,w,3);g.fillRect(0,44,w,3);g.fillStyle='#1f4f6e';g.fillRect(0,47,w,17);});
/* 마름모 살창 (사진의 창호) */
const latTex=ctex(128,256,(g,w,h)=>{g.fillStyle='#e9eef0';g.fillRect(0,0,w,h*.84);
  g.strokeStyle='#39443f';g.lineWidth=3;for(let i=-h;i<w+h;i+=14){g.beginPath();g.moveTo(i,0);g.lineTo(i+h,h);g.stroke();g.beginPath();g.moveTo(i,h);g.lineTo(i+h,0);g.stroke();}
  g.fillStyle='#4a2c1e';g.fillRect(0,h*.84,w,h*.16);g.strokeStyle='#1d3b3a';g.lineWidth=12;g.strokeRect(6,6,w-12,h-12);g.fillStyle='#1d3b3a';g.fillRect(w/2-3,0,6,h*.84);});
const glassTex=ctex(128,256,(g,w,h)=>{g.clearRect(0,0,w,h);g.fillStyle='rgba(225,236,238,.35)';g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(235,242,244,.85)';g.lineWidth=4;for(let i=-h;i<w+h;i+=22){g.beginPath();g.moveTo(i,h*.08);g.lineTo(i+h,h*1.08);g.stroke();g.beginPath();g.moveTo(i,h*.92);g.lineTo(i+h,-h*.08);g.stroke();}
  g.clearRect(0,h*.36,w,h*.28);g.fillStyle='rgba(225,236,238,.18)';g.fillRect(0,h*.36,w,h*.28);g.strokeStyle='#23201d';g.lineWidth=10;g.strokeRect(5,5,w-10,h-10);});
const plasterTex=ctex(128,128,(g,w,h)=>{g.fillStyle='#e6dcc4';g.fillRect(0,0,w,h);g.strokeStyle='#8a3b2b';g.lineWidth=10;g.strokeRect(5,5,w-10,h-10);g.strokeStyle='#2f7d6d';g.lineWidth=3;g.strokeRect(15,15,w-30,h-30);});
const graniteDraw=(g,w,h)=>{g.fillStyle='#cfccc6';g.fillRect(0,0,w,h);speckle(g,w,h,2500,['#a9a6a0','#e4e1dc','#8f8c86','#bdb9b2'],.7);g.strokeStyle='rgba(120,116,110,.55)';g.lineWidth=2;
  for(let y=0;y<=h;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}for(let y=0;y<h;y+=64)for(let x=((y/64)%2)*64;x<=w;x+=128){g.beginPath();g.moveTo(x,y);g.lineTo(x,y+64);g.stroke();}};
const granCache={};function granite(w,h){const k=Math.round(w)+'_'+Math.round(h);if(!granCache[k]){const t=ctex(256,256,graniteDraw,[Math.max(1,w/2.4),Math.max(1,h/2.4)]);granCache[k]=std({map:t});}return granCache[k];}
const stoneTex=ctex(128,128,(g,w,h)=>{g.fillStyle='#c4c1bb';g.fillRect(0,0,w,h);speckle(g,w,h,1600,['#9d9a94','#dedbd6','#aeaba5'],.6);});
const paverTex=ctex(256,256,(g,w,h)=>{const cols=['#a3a8ad','#b4b8bc','#8f959b','#9ca1a6','#bfc2c5'];g.fillStyle='#7d8286';g.fillRect(0,0,w,h);for(let r=0;r<16;r++){const off=(r%2)*16;for(let c=-1;c<9;c++){g.fillStyle=cols[(rnd()*cols.length)|0];g.fillRect(off+c*32+1,r*16+1,30,14);}}},[25,20]);
const asphaltTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#55595c';g.fillRect(0,0,w,h);speckle(g,w,h,5000,['#44484b','#6a6e71','#5e6265'],.6);},[60,60]);
const grassTex=ctex(128,128,(g,w,h)=>{g.fillStyle='#7d8a4a';g.fillRect(0,0,w,h);speckle(g,w,h,3000,['#6b7a3a','#8f9b58','#a39a5a'],.7);},[4,4]);
const brickDraw=(g,w,h)=>{g.fillStyle='#8a3a2b';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=8){const off=(y/8%2)*12;for(let x=-24;x<w;x+=24){g.fillStyle=`rgb(${128+(rnd()*22|0)},${50+(rnd()*12|0)},${38+(rnd()*10|0)})`;g.fillRect(x+off+1,y+1,22,6);}}};
const brickTex=ctex(256,256,brickDraw,[4,2]);
const floorTex=ctex(256,256,(g,w,h)=>{for(let by=0;by<4;by++)for(let bx=0;bx<4;bx++){const x0=bx*64,y0=by*64,vert=(bx+by)%2;
  for(let k=0;k<4;k++){const v=(rnd()*26)|0;g.fillStyle=`rgb(${178+v},${112+v*.7},${56+v*.4})`;if(vert)g.fillRect(x0+k*16,y0,16,64);else g.fillRect(x0,y0+k*16,64,16);
    g.fillStyle='rgba(70,35,10,.45)';if(vert)g.fillRect(x0+k*16,y0,1.5,64);else g.fillRect(x0,y0+k*16,64,1.5);}}
  speckle(g,w,h,500,['#7a4a22'],.2);},[6,4]);
const ceilTex=ctex(128,128,(g,w,h)=>{g.fillStyle='#3a2a22';g.fillRect(0,0,w,h);g.fillStyle='#1f4a40';g.fillRect(10,10,w-20,h-20);g.fillStyle='#16303a';g.fillRect(20,20,w-40,h-40);
  g.fillStyle='#a8333a';for(let i=0;i<8;i++){const a=i/8*Math.PI*2;g.beginPath();g.ellipse(64+Math.cos(a)*24,64+Math.sin(a)*24,12,7,a,0,7);g.fill();}g.fillStyle='#d9c79a';g.beginPath();g.arc(64,64,12,0,7);g.fill();},[12,8]);
const woodCarveTex=ctex(256,128,(g,w,h)=>{g.fillStyle='#c79257';g.fillRect(0,0,w,h);for(let i=0;i<4;i++){const x=6+i*63;g.fillStyle='#b27c43';g.fillRect(x,10,56,h-20);g.strokeStyle='#8a5a2c';g.lineWidth=3;g.strokeRect(x,10,56,h-20);
  g.strokeStyle='rgba(90,55,25,.8)';g.lineWidth=2.5;for(let k=0;k<5;k++){g.beginPath();g.moveTo(x+6+rnd()*10,20+rnd()*80);g.bezierCurveTo(x+rnd()*56,10+rnd()*100,x+rnd()*56,10+rnd()*100,x+40+rnd()*12,20+rnd()*80);g.stroke();}}},[1,1]);
const taengTex=ctex(512,448,(g,w,h)=>{g.fillStyle='#6e2a1c';g.fillRect(0,0,w,h);
  const fig=(x,y,s,robe)=>{g.fillStyle='rgba(217,164,65,.8)';g.beginPath();g.arc(x,y,16*s,0,7);g.fill();g.fillStyle='#2f6d60';g.beginPath();g.arc(x,y,12*s,0,7);g.fill();g.fillStyle='#e0bf8a';g.beginPath();g.arc(x,y,9*s,0,7);g.fill();g.fillStyle='#2a2320';g.fillRect(x-8*s,y-10*s,16*s,5*s);g.fillStyle=robe;g.beginPath();g.moveTo(x,y+8*s);g.lineTo(x-20*s,y+50*s);g.lineTo(x+20*s,y+50*s);g.fill();};
  const robes=['#8c3324','#2f6d60','#5a3d2a','#1f4f6e','#7a2a1e'];
  for(let r=0;r<5;r++){const y=40+r*82;for(let c=0;c<9;c++){const x=40+c*54;if(Math.abs(x-256)<120&&y>120)continue;fig(x,y,1,robes[(r+c)%5]);}}
  g.strokeStyle='#23422f';g.lineWidth=14;g.strokeRect(7,7,w-14,h-14);g.strokeStyle='#c49a45';g.lineWidth=2;g.strokeRect(16,16,w-32,h-32);});
const shinTex=ctex(256,320,(g,w,h)=>{g.fillStyle='#2c3a52';g.fillRect(0,0,w,h);const cols=['#c43d2b','#2f7d6d','#e0b040','#6a3b8a','#e8e0d0'];
  for(let r=0;r<4;r++)for(let c=0;c<5;c++){const x=28+c*50,y=40+r*72;g.fillStyle=cols[(r*2+c)%5];g.beginPath();g.moveTo(x,y+8);g.lineTo(x-18,y+60);g.lineTo(x+18,y+60);g.fill();g.fillStyle='#e0bf8a';g.beginPath();g.arc(x,y,9,0,7);g.fill();g.fillStyle='#d9a441';g.fillRect(x-10,y-14,20,5);}
  g.strokeStyle='#8c2a1e';g.lineWidth=12;g.strokeRect(6,6,w-12,h-12);});
const wonbulTex=ctex(256,160,(g,w,h)=>{g.fillStyle='#f4f1ea';g.fillRect(0,0,w,h);for(let r=0;r<8;r++){g.fillStyle='#d8d4cc';g.fillRect(0,r*20+17,w,3);for(let c=0;c<24;c++){const x=6+c*10.3,y=r*20+4;g.fillStyle='#ffffff';g.beginPath();g.arc(x,y+2,2.4,0,7);g.fill();g.beginPath();g.moveTo(x,y+3);g.lineTo(x-4,y+13);g.lineTo(x+4,y+13);g.fill();}}},[1,1]);
const gableTex=ctex(256,160,(g,w,h)=>{g.fillStyle='#e3d3a4';g.fillRect(0,0,w,h);g.strokeStyle='#2f6d60';g.lineWidth=10;g.beginPath();g.moveTo(0,h);g.lineTo(w/2,0);g.lineTo(w,h);g.closePath();g.stroke();
  const cx=w/2,cy=h*.62;g.fillStyle='#c9a24a';g.beginPath();g.arc(cx,cy,30,0,7);g.fill();g.fillStyle='#e3d3a4';g.beginPath();g.arc(cx,cy,25,0,7);g.fill();
  g.strokeStyle='#8a6a2a';g.lineWidth=5;g.lineCap='square';const s=13;g.beginPath();g.moveTo(cx,cy-s);g.lineTo(cx,cy+s);g.moveTo(cx-s,cy);g.lineTo(cx+s,cy);g.moveTo(cx,cy-s);g.lineTo(cx+s,cy-s);g.moveTo(cx+s,cy);g.lineTo(cx+s,cy+s);g.moveTo(cx,cy+s);g.lineTo(cx-s,cy+s);g.moveTo(cx-s,cy);g.lineTo(cx-s,cy-s);g.stroke();});
/* 처마 밑 초각 (사진 2) */
function cloudTex(main,band){return ctex(128,192,(g,w,h)=>{g.clearRect(0,0,w,h);g.beginPath();g.moveTo(10,6);g.lineTo(118,6);g.bezierCurveTo(118,40,70,40,78,70);g.bezierCurveTo(88,100,40,96,50,126);g.bezierCurveTo(58,150,34,160,40,186);g.lineTo(18,186);g.bezierCurveTo(10,150,30,140,26,118);g.bezierCurveTo(20,90,62,90,52,64);g.bezierCurveTo(44,40,10,40,10,6);g.closePath();
  g.fillStyle=main;g.fill();g.lineWidth=7;g.strokeStyle=band;g.stroke();g.lineWidth=2;g.strokeStyle='#efe8d8';g.stroke();});}
const cloudRed=cloudTex('#b8413a','#5fb39a'),cloudGreen=cloudTex('#4f9f84','#b8413a');
const juryeonTex=ctex(32,256,(g,w,h)=>{g.fillStyle='#f2eee4';g.fillRect(0,0,w,h);g.fillStyle='#1c1c1c';for(let i=0;i<7;i++){const y=14+i*34;g.fillRect(9,y,14,3);g.fillRect(14,y-4,3,20);g.fillRect(8,y+10,16,3);}g.strokeStyle='#6b4a2a';g.lineWidth=4;g.strokeRect(2,2,w-4,h-4);});
function plaqueTex(text){return ctex(512,160,(g,w,h)=>{g.fillStyle='#15191c';g.fillRect(0,0,w,h);g.strokeStyle='#2f6d60';g.lineWidth=14;g.strokeRect(7,7,w-14,h-14);g.strokeStyle='#c9a24a';g.lineWidth=3;g.strokeRect(20,20,w-40,h-40);
  g.fillStyle='#e6cf8e';g.font='700 92px '+SERIF;g.textAlign='center';g.textBaseline='middle';const ch=[...text],n=ch.length,span=(w-80)/n;ch.forEach((c,i)=>g.fillText(c,w-40-span*(i+.5),h/2+4));},null,true);} /* 전통 현판: 오른쪽→왼쪽 */

function makeRoof(W,D,H,rw,lift,flare,sag,mats){
  mats=mats||{top:M.tile,under:M.under,ridge:M.ridge};
  const nu=24,nv=10,pos=[],uv=[],idx=[];
  const eave=(s,t)=>{const e=Math.pow(Math.abs(t),2.4),sg=Math.sign(t),y=lift*e;
    if(s===0)return[t*W/2+sg*flare*e,y,D/2+flare*e];if(s===1)return[-t*W/2-sg*flare*e,y,-D/2-flare*e];
    if(s===2)return[-W/2-flare*e,y,t*D/2+sg*flare*e];return[W/2+flare*e,y,-t*D/2-sg*flare*e];};
  const ridge=(s,t)=>s===0?[t*rw/2,H,0]:s===1?[-t*rw/2,H,0]:s===2?[-rw/2,H,0]:[rw/2,H,0];
  const pt=(s,t,v)=>{const E=eave(s,t),R=ridge(s,t);return[E[0]+(R[0]-E[0])*v,E[1]+(R[1]-E[1])*v-sag*Math.sin(Math.PI*v),E[2]+(R[2]-E[2])*v];};
  for(let s=0;s<4;s++){const base=pos.length/3,L=s<2?W:D,SL=Math.hypot(H,(s<2?D:W)/2);
    for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){const t=-1+2*i/nu,v=j/nv,p=pt(s,t,v);pos.push(p[0],p[1],p[2]);uv.push((t+1)/2*L/2,v*SL/2);}
    for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=base+j*(nu+1)+i,b=a+1,c=a+nu+1,d=c+1;idx.push(a,b,c,b,d,c);}}
  const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(pos,3));geo.setAttribute('uv',new T.Float32BufferAttribute(uv,2));
  geo.setIndex(idx);geo.computeVertexNormals();
  const g=new T.Group();const top=new T.Mesh(geo,mats.top);top.castShadow=true;top.receiveShadow=true;g.add(top);g.add(new T.Mesh(geo,mats.under));
  const rb=new T.Mesh(new T.BoxGeometry(rw+.3,.36,.44),mats.ridge);rb.position.y=H+.07;rb.castShadow=true;g.add(rb);
  [-1,1].forEach(sx=>{const e=new T.Mesh(new T.BoxGeometry(.26,.7,.38),mats.ridge);e.position.set(sx*(rw/2+.12),H+.36,0);e.rotation.z=-sx*.3;g.add(e);});
  [[0,-1],[0,1],[1,-1],[1,1]].forEach(([s,t])=>{const pts=[];for(let k=0;k<=8;k++){const p=pt(s,t,k/8);pts.push(new T.Vector3(p[0],p[1]+.08,p[2]));}
    const tb=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),16,.11,6),mats.ridge);tb.castShadow=true;g.add(tb);});
  return g;
}

const INFO={
  overview:{t:'전경',d:'강릉 도심의 포교당. 화강석 기단 위에 올린 법당을 서쪽에, 4층 벽돌 건물을 북쪽에, 금천관과 컨테이너를 동쪽에 두고, 가운데 마당은 잔디 화단과 주차장이다. 이름표를 누르면 다가간다.'},
  hall:{t:'극락전 極樂殿',d:'화강석으로 마감한 기단층 위에 앉힌 정면 5칸 목조 법당. 팔작지붕 합각에 卍자, 처마 밑에 붉은·녹색 초각, 앞기둥마다 주련. 마당에서 두 갈래 돌계단으로 오르고, 옆 돌계단은 붉은 문으로 잠겨 있다.'},
  inside:{t:'법당 내부',d:'수미단 위 금색 본존불과 후불탱화, 양옆 원불벽. 앞 예단에 놋쇠 촛대 넷. 번(幡)에 오방불·삼신불·지장보살·도명존자·무독귀왕과 降魔眞言. 천장은 이름표 단 연등으로 덮였고, 법고와 예불상, 좌복이 놓였다.'},
  door:{t:'법당 입구',d:'가운데 칸은 미닫이 유리문, 좌우는 마름모 살창. 창 아래로 의자를 줄지어 두었다. 문밖으로 마당과 컨테이너가 보인다.'},
  yard:{t:'앞마당',d:'두 개의 잔디 화단을 화강석 경계석으로 두르고 네모난 돌을 줄지어 놓았다. 나머지는 회색 보도블록 주차장이다.'},
  brick:{t:'4층 벽돌 건물',d:'반원 창과 원형 창이 줄지은 붉은 벽돌 건물. 2층 난간 아래에 "강릉포교당관음사 신도회 행복나눔봉사회" 현수막이 걸려 있다.'},
  geum:{t:'금천관',d:'벽돌 건물 동쪽 끝, 아치형 캐노피가 달린 출입구. 옆에 컨테이너가 두 단으로 쌓여 있다.'}
};
const LBL=[{k:'hall',p:[HX,15,0],r:34},{k:'yard',p:[7.5,2.6,3.5],r:22},{k:'brick',n:'벽돌 건물',p:[10,17.5,-24],r:40},{k:'geum',p:[25.2,5.2,-15.5],r:18}];
const labelsEl=document.getElementById('labels');
LBL.forEach(l=>{const b=document.createElement('button');b.className='lbl';b.textContent=l.n||INFO[l.k].t.split(' ')[0];b.addEventListener('click',()=>focusOn(l));labelsEl.appendChild(b);l.el=b;l.v=new T.Vector3(...l.p);});
const iName=document.getElementById('iName'),iText=document.getElementById('iText'),infoEl=document.getElementById('info');let curInfo='';
function setInfo(k){if(k===curInfo)return;curInfo=k;iName.textContent=INFO[k].t;iText.textContent=INFO[k].d;}

/* ---------- camera state ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const S={mode:'orbit',theta:.85,phi:.95,radius:78,target:new T.Vector3(0,3,-3),pos:new T.Vector3(10,0,15),yaw:1,pitch:.04,eye:1.6,keys:{},anim:null};
const hint=document.getElementById('hint'),pad=document.getElementById('pad'),modeBtn=document.getElementById('modeBtn'),fade=document.getElementById('fade');
function setMode(m){S.mode=m;const w=m==='walk';modeBtn.setAttribute('aria-pressed',String(w));modeBtn.textContent=w?'둘러보기':'걷기';
  pad.hidden=!w;infoEl.classList.toggle('full',!w);
  hint.textContent=w?'W A S D 이동 · 드래그로 시선 · Shift 달리기':'드래그 회전 · 휠/핀치 확대 · Shift+드래그 이동';}
function free(x,z){const R=.35;if(x<-24||x>29||z<-19||z>24)return false;for(const c of colliders)if(x>c.x0-R&&x<c.x1+R&&z>c.z0-R&&z<c.z1+R)return false;return true;}
function moveWalk(sx,fw){const y=S.yaw,dx=-Math.sin(y)*fw+Math.cos(y)*sx,dz=-Math.cos(y)*fw-Math.sin(y)*sx,p=S.pos;
  if(free(p.x+dx,p.z+dz)){p.x+=dx;p.z+=dz;}else if(free(p.x+dx,p.z))p.x+=dx;else if(free(p.x,p.z+dz))p.z+=dz;}
function orbitTo(t,theta,phi,radius){S.anim=null;const to={t:t.clone(),theta,phi,radius};
  if(reduce){S.target.copy(to.t);S.theta=theta;S.phi=phi;S.radius=radius;return;}
  let d=theta-S.theta;d=((d+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  S.anim={k:0,from:{t:S.target.clone(),theta:S.theta,phi:S.phi,radius:S.radius},to:Object.assign(to,{theta:S.theta+d})};}
function walkTo(x,z,yaw,pitch){const go=()=>{S.pos.set(x,0,z);S.yaw=yaw;S.pitch=pitch||0;S.eye=heightAt(x,z)+1.6;setMode('walk');};
  if(reduce||S.mode!=='walk'){go();return;}fade.style.opacity=1;setTimeout(()=>{go();fade.style.opacity=0;},280);}
function focusOn(l){setMode('orbit');orbitTo(new T.Vector3(l.p[0],l.p[1]*.4,l.p[2]),S.theta,1.1,l.r);setInfo(l.k);markView(null);}

const VIEWS=[
  {n:'전경',info:'overview',go:()=>{setMode('orbit');orbitTo(new T.Vector3(0,3,-3),.85,.95,78);}},
  {n:'마당',info:'yard',go:()=>walkTo(10,15,1.0,.06)},
  {n:'법당',info:'hall',go:()=>{setMode('orbit');orbitTo(new T.Vector3(HX+2,6,0),1.25,1.2,32);}},
  {n:'법당 안',info:'inside',go:()=>walkTo(HX+4.4,HZ,Math.PI/2,.08)},
  {n:'법당 입구',info:'door',go:()=>walkTo(HX-1.2,HZ,-Math.PI/2,.05)},
  {n:'벽돌 건물',info:'brick',go:()=>{setMode('orbit');orbitTo(new T.Vector3(10,6,-18),.1,1.3,34);}}
];
const viewsEl=document.getElementById('views');
VIEWS.forEach((v,i)=>{const b=document.createElement('button');b.className='b';b.textContent=v.n;b.setAttribute('aria-pressed','false');
  b.addEventListener('click',()=>{v.go();setInfo(v.info);markView(i);});viewsEl.appendChild(b);v.el=b;});
function markView(i){VIEWS.forEach((v,j)=>v.el.setAttribute('aria-pressed',String(i===j)));}
modeBtn.addEventListener('click',()=>{markView(null);
  if(S.mode==='orbit'){let x=S.target.x,z=S.target.z;if(!free(x,z)){x=10;z=15;}S.pos.set(x,0,z);S.yaw=S.theta;S.pitch=0;S.eye=heightAt(x,z)+1.6;setMode('walk');}
  else{setMode('orbit');S.target.set(S.pos.x-Math.sin(S.yaw)*8,2,S.pos.z-Math.cos(S.yaw)*8);S.theta=S.yaw;S.phi=1.1;S.radius=26;S.anim=null;}});

/* ---------- time of day ---------- */
let dusk=false;const timeBtn=document.getElementById('timeBtn');
function applyTime(d){dusk=d;timeBtn.setAttribute('aria-pressed',String(d));
  skyU.top.value.set(d?0x1d2a4e:0x2f6fd0);skyU.bot.value.set(d?0xd98a62:0xc9dcf2);scene.fog.color.set(d?0x7d6a70:0xcfdcea);
  sun.color.set(d?0xff9f66:0xfff4e2);sun.intensity=d?.45:1.0;sun.position.set(d?-70:45,d?20:75,d?25:40);
  hemi.intensity=d?.32:.7;hemi.color.set(d?0x8fa0c8:0xdfe9f5);
  lanternMats.forEach(m=>m.emissiveIntensity=d?1.0:.03);window.__lantern.emissive.set(d?0x552028:0x000000);
  M.lattice.emissive.set(d?0x5a4020:0x000000);M.wonbul.emissive.set(d?0x7a7060:0x333028);
  cityMats.forEach(m=>{m.emissive.set(d?0xffd79a:0x000000);m.emissiveIntensity=d?.35:0;});
  const [pl,sp]=window.__inner;pl.intensity=d?1.2:.8;sp.intensity=d?1.6:1.1;}
timeBtn.addEventListener('click',()=>applyTime(!dusk));

/* ---------- input ---------- */
const ptrs=new Map();let pinch=0,panMode=false;
const pd=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});panMode=e.button===2||e.shiftKey;if(ptrs.size===2)pinch=pd();S.anim=null;});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const d=pd();if(pinch){if(S.mode==='orbit')S.radius=clamp(S.radius*pinch/d,4,200);else moveWalk(0,(d-pinch)*.03);}pinch=d;return;}
  if(S.mode==='orbit'){if(panMode){const k=S.radius*.0016,t=S.theta;S.target.x+=-Math.cos(t)*dx*k-Math.sin(t)*dy*k;S.target.z+=Math.sin(t)*dx*k-Math.cos(t)*dy*k;}
    else{S.theta-=dx*.006;S.phi=clamp(S.phi-dy*.005,.12,1.5);}}
  else{S.yaw-=dx*.004;S.pitch=clamp(S.pitch-dy*.003,-1.1,1.1);}});
const up=e=>{ptrs.delete(e.pointerId);pinch=0;};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();S.anim=null;if(S.mode==='orbit')S.radius=clamp(S.radius*Math.exp(e.deltaY*.001),4,200);else moveWalk(0,-e.deltaY*.01);},{passive:false});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k.startsWith('arrow')||k===' ')e.preventDefault();S.keys[k]=true;S.keys.shift=e.shiftKey;});
addEventListener('keyup',e=>{S.keys[e.key.toLowerCase()]=false;S.keys.shift=e.shiftKey;});
addEventListener('blur',()=>{S.keys={};});
pad.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);S.keys[k]=true;});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{S.keys[k]=false;}));});

/* ---------- loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const clock=new T.Clock(),tmp=new T.Vector3();let zoneT=0;
function frame(){const dt=Math.min(clock.getDelta(),.05),K=S.keys;
  const f=(K.w||K.arrowup?1:0)-(K.s||K.arrowdown?1:0),sx=(K.d?1:0)-(K.a?1:0),turn=(K.arrowleft||K.q?1:0)-(K.arrowright||K.e?1:0);
  if(S.mode==='walk'){S.yaw+=turn*1.7*dt;const sp=(K.shift?7:3.2)*dt;if(f||sx)moveWalk(sx*sp,f*sp);
    S.eye+=(heightAt(S.pos.x,S.pos.z)+1.6-S.eye)*Math.min(1,dt*8);
    camera.position.set(S.pos.x,S.eye,S.pos.z);
    camera.lookAt(S.pos.x-Math.sin(S.yaw)*Math.cos(S.pitch),S.eye+Math.sin(S.pitch),S.pos.z-Math.cos(S.yaw)*Math.cos(S.pitch));
    zoneT-=dt;if(zoneT<=0){zoneT=.3;const p=S.pos;
      if(p.x>HX-5.5&&p.x<HX+5.5&&Math.abs(p.z-HZ)<8)setInfo('inside');
      else{let best=null,bd=16;LBL.forEach(l=>{const d=Math.hypot(l.p[0]-p.x,l.p[2]-p.z);if(d<bd){bd=d;best=l.k;}});if(best)setInfo(best);}}}
  else{if(f||sx||turn){const k=S.radius*.6*dt,t=S.theta;S.target.x+=(-Math.sin(t)*f+Math.cos(t)*sx)*k;S.target.z+=(-Math.cos(t)*f-Math.sin(t)*sx)*k;S.theta-=turn*dt;}
    if(S.anim){const a=S.anim;a.k=Math.min(1,a.k+dt/1.3);const e=a.k<.5?4*a.k*a.k*a.k:1-Math.pow(-2*a.k+2,3)/2;
      S.target.lerpVectors(a.from.t,a.to.t,e);S.theta=a.from.theta+(a.to.theta-a.from.theta)*e;S.phi=a.from.phi+(a.to.phi-a.from.phi)*e;S.radius=a.from.radius+(a.to.radius-a.from.radius)*e;if(a.k>=1)S.anim=null;}
    const sp=Math.sin(S.phi);camera.position.set(S.target.x+S.radius*sp*Math.sin(S.theta),Math.max(S.target.y+S.radius*Math.cos(S.phi),.5),S.target.z+S.radius*sp*Math.cos(S.theta));camera.lookAt(S.target);}
  sky.position.copy(camera.position);
  camera.updateMatrixWorld();const W=innerWidth,H=innerHeight;
  LBL.forEach(l=>{tmp.copy(l.v).project(camera);const vis=S.mode==='orbit'&&tmp.z<1&&Math.abs(tmp.x)<1.05&&Math.abs(tmp.y)<1.05;
    l.el.hidden=!vis;if(vis)l.el.style.transform=`translate(${(tmp.x*.5+.5)*W}px,${(-tmp.y*.5+.5)*H}px) translate(-50%,calc(-100% - 7px))`;});
  renderer.render(scene,camera);requestAnimationFrame(frame);}

applyTime(false);setInfo('overview');markView(0);setMode('orbit');
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('700 40px "Noto Serif KR"','南無北方無憂世界不動尊如來佛西極樂阿彌陀中華藏毘盧遮那南歡喜寶勝東滿月藥師琉璃光右補處毒鬼王左道明者幽冥敎主地菩薩降魔眞言千百億化身釋迦牟尼淸淨法圓報舍殿'),
  document.fonts.load('700 13px "Noto Sans KR"','강릉포교당관음사 신도회 행복나눔봉사회금천관')]).then(()=>{redraw.forEach(t=>{const g=t._c.getContext('2d');g.clearRect(0,0,t._c.width,t._c.height);t._draw(g,t._c.width,t._c.height);t.needsUpdate=true;});}).catch(()=>{});}
})();
</script>
</body></html>
