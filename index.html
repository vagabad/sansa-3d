<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>산사 가람 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --ink:#15181b; --panel:rgba(21,24,27,.84); --line:rgba(239,232,216,.16);
  --paper:#efe8d8; --muted:#b8ae98; --green:#2f7d6d; --red:#b8412c; --gold:#d9a441;
  --serif:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);overflow:hidden;font-family:var(--sans)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;font:500 13px/1 var(--serif);color:var(--paper);
  background:rgba(21,24,27,.72);border:1px solid rgba(217,164,65,.55);border-radius:3px;padding:5px 8px;white-space:nowrap;letter-spacing:.04em}
.lbl::after{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:6px;background:rgba(217,164,65,.8)}
.lbl:hover,.lbl:focus-visible{background:var(--red);outline:none}
#title{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;max-width:calc(100% - 32px);pointer-events:none}
#title .eb{font:500 11px/1 var(--sans);letter-spacing:.22em;color:var(--gold)}
#title h1{margin:6px 0 4px;font:700 26px/1.1 var(--serif);letter-spacing:.06em;text-shadow:0 1px 8px rgba(0,0,0,.5)}
#title p{margin:0;font-size:12px;color:var(--paper);opacity:.85;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#info{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);width:min(360px,calc(100% - 32px));
  background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--green);padding:12px 14px;border-radius:2px;backdrop-filter:blur(6px)}
#info h2{margin:0 0 6px;font:700 17px/1.2 var(--serif);letter-spacing:.05em}
#info p{margin:0;font-size:13px;line-height:1.65;color:#ded6c3;text-wrap:pretty}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);
  display:flex;gap:10px;align-items:center;background:linear-gradient(to top,rgba(21,24,27,.9),rgba(21,24,27,0))}
#views{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
#views::-webkit-scrollbar{display:none}
.tog{display:flex;gap:6px;flex:none}
button.b{font:500 13px/1 var(--sans);color:var(--paper);background:rgba(21,24,27,.78);border:1px solid var(--line);
  border-radius:2px;padding:9px 12px;cursor:pointer;white-space:nowrap}
button.b:hover{border-color:rgba(217,164,65,.7)}
button.b:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.b[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
button.b.acc{background:var(--red);border-color:var(--red)}
#pad{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px}
#pad button{width:48px;height:48px;padding:0;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
#pad .up{grid-column:2;grid-row:1}#pad .lt{grid-column:1;grid-row:2}#pad .dn{grid-column:2;grid-row:2}#pad .rt{grid-column:3;grid-row:2}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s}
#err{position:fixed;inset:0;display:grid;place-items:center;padding:16px;text-align:center;font-size:14px;color:var(--muted)}
@media (max-width:560px){
  #title h1{font-size:21px}
  #info{bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:calc(100% - 32px - 170px);min-width:150px;padding:10px 12px}
  #info p{font-size:12px;line-height:1.55}
  #info.full{width:calc(100% - 32px)}
}
@media (prefers-reduced-motion:reduce){#fade{transition:none}}
</style>

</head><body><canvas id="c" tabindex="0" aria-label="산사 가람 3D 장면"></canvas>
<div id="labels"></div>
<header id="title">
  <div class="eb">伽藍配置 · 3D</div>
  <h1>산사 가람</h1>
  <p id="hint">드래그 회전 · 휠/핀치 확대 · Shift+드래그 이동</p>
</header>
<section id="info" class="full"><h2 id="iName">전경</h2><p id="iText"></p></section>
<div id="pad" hidden>
  <button class="b up" data-k="w" aria-label="앞으로">▲</button>
  <button class="b lt" data-k="arrowleft" aria-label="왼쪽으로 돌기">◀</button>
  <button class="b dn" data-k="s" aria-label="뒤로">▼</button>
  <button class="b rt" data-k="arrowright" aria-label="오른쪽으로 돌기">▶</button>
</div>
<nav id="bar">
  <div id="views"></div>
  <div class="tog">
    <button class="b" id="modeBtn" aria-pressed="false">걷기</button>
    <button class="b" id="timeBtn" aria-pressed="false">황혼</button>
  </div>
</nav>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<div id="err">3D 라이브러리를 불러오지 못했습니다. 새로고침해 주세요.</div>');return;}
const T=THREE;
const canvas=document.getElementById('c');
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:true});}catch(e){document.body.insertAdjacentHTML('beforeend','<div id="err">이 브라우저에서 WebGL을 쓸 수 없습니다.</div>');return;}
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(58,1,0.25,1000);
scene.fog=new T.Fog(0xcfd8d6,90,420);

/* ---------- helpers ---------- */
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=4;if(rep)t.repeat.set(rep[0],rep[1]);t._c=c;t._draw=draw;return t;}
function speckle(g,w,h,n,cols,a){for(let i=0;i<n;i++){g.fillStyle=cols[(rnd()*cols.length)|0];g.globalAlpha=a*rnd();const s=1+rnd()*3;g.fillRect(rnd()*w,rnd()*h,s,s);}g.globalAlpha=1;}
const std=o=>new T.MeshStandardMaterial(Object.assign({roughness:.85,metalness:0},o));

/* ---------- textures ---------- */
const tileTex=ctex(128,128,(g,w,h)=>{g.fillStyle='#3c4145';g.fillRect(0,0,w,h);
  for(let i=0;i<8;i++){const x=i*16,gr=g.createLinearGradient(x,0,x+16,0);gr.addColorStop(0,'#26292c');gr.addColorStop(.5,'#5b6166');gr.addColorStop(1,'#26292c');g.fillStyle=gr;g.fillRect(x+1,0,14,h);}
  g.fillStyle='rgba(0,0,0,.28)';for(let j=0;j<4;j++)g.fillRect(0,j*32,w,3);});
const dcTex=ctex(256,64,(g,w,h)=>{g.fillStyle='#2f7d6d';g.fillRect(0,0,w,h);g.fillStyle='#1f4f6e';g.fillRect(0,0,w,6);g.fillRect(0,h-6,w,6);
  for(const cx of [0,128,256]){['#b8412c','#efe8d8','#1f4f6e','#d9a441','#b8412c'].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.ellipse(cx,h/2,30-i*6,23-i*4.3,0,0,Math.PI*2);g.fill();});}
  g.strokeStyle='#efe8d8';g.lineWidth=2;for(const s of [40,168])for(let x=s;x<s+50;x+=8){g.beginPath();g.moveTo(x,9);g.lineTo(x,h-9);g.stroke();}
  g.fillStyle='#b8412c';g.fillRect(34,9,4,h-18);g.fillRect(90,9,4,h-18);g.fillRect(162,9,4,h-18);g.fillRect(218,9,4,h-18);});
const doorTex=ctex(128,256,(g,w,h)=>{g.fillStyle='#eadfc4';g.fillRect(0,0,w,h);g.strokeStyle='#8b4a2b';g.lineWidth=4;
  for(let i=-h;i<w+h;i+=15){g.beginPath();g.moveTo(i,0);g.lineTo(i+h,h);g.stroke();g.beginPath();g.moveTo(i,h);g.lineTo(i+h,0);g.stroke();}
  g.fillStyle='#b8412c';for(let y=0;y<h;y+=15)for(let x=(y/15%2)*7.5;x<w;x+=15){g.beginPath();g.arc(x,y,2.6,0,7);g.fill();}
  g.fillStyle='#8b4a2b';g.fillRect(0,h*.72,w,h*.28);g.fillStyle='#6d3a22';g.fillRect(14,h*.76,w-28,h*.2);
  g.strokeStyle='#6a2e1d';g.lineWidth=12;g.strokeRect(6,6,w-12,h-12);g.fillStyle='#6a2e1d';g.fillRect(w/2-3,0,6,h);},[2,1]);
const plasterTex=ctex(128,128,(g,w,h)=>{g.fillStyle='#e6dcc4';g.fillRect(0,0,w,h);speckle(g,w,h,300,['#d4c9ae','#f2ead6'],.5);
  g.strokeStyle='#8a3b2b';g.lineWidth=10;g.strokeRect(5,5,w-10,h-10);g.strokeStyle='#2f7d6d';g.lineWidth=3;g.strokeRect(15,15,w-30,h-30);});
const brTex=ctex(64,64,(g,w,h)=>{g.fillStyle='#2f7d6d';g.fillRect(0,0,w,h);g.fillStyle='#b8412c';g.fillRect(0,0,w,12);g.fillStyle='#efe8d8';g.fillRect(0,12,w,3);g.fillRect(0,44,w,3);g.fillStyle='#1f4f6e';g.fillRect(0,47,w,17);});
const stoneTex=ctex(128,128,(g,w,h)=>{g.fillStyle='#a19d93';g.fillRect(0,0,w,h);speckle(g,w,h,1600,['#7d796f','#c4c0b6','#8e8a80'],.6);});
const grassTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#5a683a';g.fillRect(0,0,w,h);speckle(g,w,h,6000,['#48572d','#6f7d46','#7a7248'],.7);},[90,90]);
const sandTex=ctex(256,256,(g,w,h)=>{g.fillStyle='#cdbf9c';g.fillRect(0,0,w,h);speckle(g,w,h,5000,['#b8a882','#ddd0b0','#a89a78'],.6);},[12,15]);
function pathTex(len){return ctex(128,128,(g,w,h)=>{g.fillStyle='#aaa599';g.fillRect(0,0,w,h);speckle(g,w,h,900,['#8d887d','#c2bdb2'],.5);
  g.strokeStyle='#6f6b62';g.lineWidth=3;g.strokeRect(0,0,64,64);g.strokeRect(64,0,64,64);g.strokeRect(-32,64,64,64);g.strokeRect(32,64,64,64);g.strokeRect(96,64,64,64);},[1,len/3.2]);}
const floorTex=ctex(256,256,(g,w,h)=>{for(let r=0;r<8;r++){const off=(r%2)*64;for(let c=-1;c<3;c++){const v=(rnd()*18)|0;g.fillStyle=`rgb(${128+v},${84+v*.6},${48+v*.4})`;g.fillRect(off+c*128,r*32,128,32);g.fillStyle='rgba(40,20,8,.55)';g.fillRect(off+c*128,r*32,2,32);}g.fillStyle='rgba(40,20,8,.6)';g.fillRect(0,r*32,w,2);}speckle(g,w,h,600,['#5d3a1f'],.25);},[4,3]);
const ceilTex=ctex(128,128,(g,w,h)=>{g.fillStyle='#8a3b2b';g.fillRect(0,0,w,h);g.fillStyle='#2f7d6d';g.fillRect(10,10,w-20,h-20);g.fillStyle='#1f4f6e';g.fillRect(20,20,w-40,h-40);
  g.fillStyle='#d9483b';for(let i=0;i<8;i++){const a=i/8*Math.PI*2;g.beginPath();g.ellipse(64+Math.cos(a)*24,64+Math.sin(a)*24,12,7,a,0,7);g.fill();}
  g.fillStyle='#efe8d8';g.beginPath();g.arc(64,64,15,0,7);g.fill();g.fillStyle='#d9a441';g.beginPath();g.arc(64,64,8,0,7);g.fill();},[10,6]);
const haloTex=ctex(256,256,(g,w,h)=>{g.clearRect(0,0,w,h);const c=128;
  g.fillStyle='#d9a441';for(let i=0;i<28;i++){const a=i/28*Math.PI*2;g.beginPath();g.moveTo(c+Math.cos(a-.09)*112,c+Math.sin(a-.09)*112);g.lineTo(c+Math.cos(a)*127,c+Math.sin(a)*127);g.lineTo(c+Math.cos(a+.09)*112,c+Math.sin(a+.09)*112);g.fill();}
  [[114,'#d9a441'],[104,'#b8412c'],[92,'#2f7d6d'],[80,'#1f4f6e'],[70,'#d9a441'],[62,'#8c2a1e'],[40,'#c78f35']].forEach(([r,col])=>{g.fillStyle=col;g.beginPath();g.arc(c,c,r,0,7);g.fill();});
  g.strokeStyle='#efe8d8';g.lineWidth=2;g.beginPath();g.arc(c,c,86,0,7);g.stroke();});
const taengTex=ctex(512,576,(g,w,h)=>{g.fillStyle='#7d2317';g.fillRect(0,0,w,h);
  g.fillStyle='rgba(223,236,226,.18)';for(let i=0;i<26;i++){g.beginPath();g.ellipse(rnd()*w,rnd()*h,30+rnd()*40,12+rnd()*10,0,0,7);g.fill();}
  g.fillStyle='#d9a441';g.beginPath();g.ellipse(256,330,150,200,0,0,7);g.fill();g.fillStyle='#2f7d6d';g.beginPath();g.ellipse(256,330,136,186,0,0,7);g.fill();
  g.fillStyle='#1f4f6e';g.beginPath();g.ellipse(256,330,118,168,0,0,7);g.fill();
  g.fillStyle='#d9a441';g.beginPath();g.arc(256,200,58,0,7);g.fill();g.fillStyle='#2f7d6d';g.beginPath();g.arc(256,200,48,0,7);g.fill();
  g.fillStyle='#b8412c';g.beginPath();g.moveTo(256,220);g.bezierCurveTo(170,250,150,430,150,470);g.lineTo(362,470);g.bezierCurveTo(362,430,342,250,256,220);g.fill();
  g.strokeStyle='#d9a441';g.lineWidth=3;g.stroke();
  g.fillStyle='#e3bf7a';g.beginPath();g.arc(256,198,30,0,7);g.fill();g.fillStyle='#2a2320';g.beginPath();g.arc(256,168,15,0,7);g.fill();
  const fig=(x,y,s,robe)=>{g.fillStyle='#d9a441';g.beginPath();g.arc(x,y,17*s,0,7);g.fill();g.fillStyle=robe;g.beginPath();g.moveTo(x,y+8*s);g.lineTo(x-20*s,y+62*s);g.lineTo(x+20*s,y+62*s);g.fill();g.fillStyle='#e3bf7a';g.beginPath();g.arc(x,y,10*s,0,7);g.fill();};
  [[70,110],[130,80],[382,80],[442,110],[60,260],[452,260],[70,410],[442,410]].forEach(([x,y],i)=>fig(x,y,1.1,i%2?'#2f7d6d':'#1f4f6e'));
  g.fillStyle='#3b6b3a';g.fillRect(150,470,212,26);g.fillStyle='#d9483b';for(let i=0;i<9;i++){g.beginPath();g.ellipse(166+i*23,470,11,18,0,Math.PI,0);g.fill();}
  g.strokeStyle='#1f4f6e';g.lineWidth=18;g.strokeRect(9,9,w-18,h-18);g.strokeStyle='#2f7d6d';g.lineWidth=8;g.strokeRect(24,24,w-48,h-48);g.strokeStyle='#d9a441';g.lineWidth=2;g.strokeRect(30,30,w-60,h-60);});

const plaques=[];
function plaqueTex(text){const draw=(g,w,h)=>{g.fillStyle='#172636';g.fillRect(0,0,w,h);g.strokeStyle='#d9a441';g.lineWidth=12;g.strokeRect(6,6,w-12,h-12);
  g.strokeStyle='#2f7d6d';g.lineWidth=6;g.strokeRect(20,20,w-40,h-40);g.fillStyle='#ecd9a2';g.font='700 92px "Noto Serif KR","Noto Serif CJK KR",serif';g.textAlign='center';g.textBaseline='middle';
  const ch=[...text],n=ch.length,span=(w-80)/n;ch.forEach((c,i)=>g.fillText(c,w-40-span*(i+.5),h/2+4));};  /* 오른쪽에서 왼쪽으로 쓰는 전통 현판 */
  const t=ctex(512,160,draw);t.wrapS=t.wrapT=T.ClampToEdgeWrapping;plaques.push(t);return t;}

/* ---------- materials ---------- */
const dcCache={};
function dcFor(len){const r=Math.max(1,Math.round(len/3));if(!dcCache[r]){const t=dcTex.clone();t.needsUpdate=true;t.repeat.set(r,1);dcCache[r]=std({map:t});}return dcCache[r];}
const M={
  tile:std({map:tileTex,roughness:.7}), under:std({color:0x2c6a5d,side:T.BackSide}), ridge:std({color:0x2e3236,roughness:.7}),
  pillar:std({color:0x8a3b2b,roughness:.7}), door:std({map:doorTex}), plaster:std({map:plasterTex}), green:std({color:0x2f7d6d}),
  bracket:std({map:brTex}), stone:std({map:stoneTex}), gold:std({color:0xcaa24c,metalness:.55,roughness:.35,emissive:0x2a1a04}),
  bronze:std({color:0x6a5436,metalness:.7,roughness:.42,side:T.DoubleSide}), wood:std({map:floorTex,polygonOffset:true,polygonOffsetFactor:-1}),
  lacquer:std({color:0x7e2518,roughness:.55}), cushion:std({color:0x6b2438}), cap:std({color:0x33373b}), wall:std({color:0xd6cdb6}),
  grass:std({map:grassTex}), sand:std({map:sandTex,polygonOffset:true,polygonOffsetFactor:-1}),
  leaf:std({color:0x2c4a2e,flatShading:true}), bark:std({color:0x5a4130}), flame:new T.MeshBasicMaterial({color:0xffd27a}),
  glow:std({color:0xfff1c8,emissive:0xffb84d,emissiveIntensity:.15}), ceil:std({map:ceilTex}), taeng:std({map:taengTex}),
  halo:std({map:haloTex,transparent:true,alphaTest:.4,side:T.DoubleSide,metalness:.25,roughness:.5}), candle:std({color:0xf3ead6})
};
const LCOL=[0xd9483b,0xe98aa0,0xf0c24b,0x5aa86b,0x4a7fc0,0xf2efe6];
var lanternGeo=new T.SphereGeometry(.26,14,10),lineMat=new T.LineBasicMaterial({color:0x3a2a1c});
const lanternMats=LCOL.map(c=>std({color:c,emissive:c,emissiveIntensity:.04,roughness:.6}));

/* ---------- sky, lights ---------- */
const skyU={top:{value:new T.Color(0x6f9ec4)},bot:{value:new T.Color(0xdde5e1)}};
const sky=new T.Mesh(new T.SphereGeometry(480,32,16),new T.ShaderMaterial({uniforms:skyU,side:T.BackSide,depthWrite:false,
  vertexShader:'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform vec3 top;uniform vec3 bot;varying vec3 vP;void main(){float h=clamp(vP.y*1.7+.04,0.,1.);gl_FragColor=vec4(mix(bot,top,pow(h,.8)),1.);}'}));
scene.add(sky);
const hemi=new T.HemisphereLight(0xdbe8f0,0x5b5236,.65);scene.add(hemi);
const sun=new T.DirectionalLight(0xfff1dc,1.0);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-75,right:75,top:75,bottom:-75,near:10,far:260});sun.shadow.bias=-.0006;sun.shadow.camera.updateProjectionMatrix();
scene.add(sun);scene.add(sun.target);sun.target.position.set(0,0,5);

/* ---------- ground ---------- */
const colliders=[];const addCol=(x0,x1,z0,z1)=>colliders.push({x0,x1,z0,z1});
const ground=new T.Mesh(new T.PlaneGeometry(900,900),M.grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const yard=new T.Mesh(new T.PlaneGeometry(52,64),M.sand);yard.rotation.x=-Math.PI/2;yard.position.y=.03;yard.receiveShadow=true;scene.add(yard);
function path(z0,z1){const len=z0-z1,m=new T.Mesh(new T.PlaneGeometry(3.2,len),std({map:pathTex(len),polygonOffset:true,polygonOffsetFactor:-2}));
  m.rotation.x=-Math.PI/2;m.position.set(0,.06,(z0+z1)/2);m.receiveShadow=true;scene.add(m);}
path(90,32);path(32,-1.4);

/* ---------- roof ---------- */
function makeRoof(W,D,H,rw,lift,flare,sag,mats){
  mats=mats||{top:M.tile,under:M.under,ridge:M.ridge};
  const nu=24,nv=10,pos=[],uv=[],idx=[];
  const eave=(s,t)=>{const e=Math.pow(Math.abs(t),2.4),sg=Math.sign(t),y=lift*e;
    if(s===0)return[t*W/2+sg*flare*e,y,D/2+flare*e];if(s===1)return[-t*W/2-sg*flare*e,y,-D/2-flare*e];

  for(let i=0;i<=o.baysX;i++){addP(-W/2+i*bx,D/2);addP(-W/2+i*bx,-D/2);}
  for(let j=1;j<o.baysZ;j++){addP(-W/2,-D/2+j*bz);addP(W/2,-D/2+j*bz);}

  const roof=makeRoof(W+2*o.over,D+2*o.over,o.roofH,o.ridge!=null?o.ridge:W*.52,o.lift,o.over*.35,o.sag);roof.position.y=H+.47;g.add(roof);

}

const plats=[{x0:-9,x1:9,z0:-26.5,z1:-13.5,h:1.2},{x0:-19.9,x1:-14.1,z0:11.1,z1:16.9,h:.6}];
const ramps=[{x0:-5,x1:5,z0:-13.5,z1:-11.3,a:1.2,b:0}];
function heightAt(x,z){let h=0;for(const p of plats)if(x>p.x0&&x<p.x1&&z>p.z0&&z<p.z1)h=Math.max(h,p.h);
  for(const r of ramps)if(x>r.x0&&x<r.x1&&z>r.z0&&z<r.z1)h=Math.max(h,r.a+(r.b-r.a)*(z-r.z0)/(r.z1-r.z0));return h;}

/* ---------- info & labels ---------- */
const INFO={
  overview:{t:'전경',d:'일주문에서 천왕문을 지나 석탑과 석등을 거쳐 대웅전에 이르는 한 줄 축(軸)의 가람. 드래그로 돌려보고, 이름표를 누르면 그 전각으로 다가간다.'},
  ilju:{t:'일주문 一柱門',d:'기둥을 한 줄로 세운 첫 산문(山門). 여기서부터 사찰 경내가 시작된다. 현판은 전통대로 오른쪽에서 왼쪽으로 읽는다.'},
  cw:{t:'천왕문 天王門',d:'사천왕을 모시는 문. 이 모형에서는 상(像)을 생략하고 가운데 칸만 통로로 열어 두었다. 좌우로 담장이 경내를 두른다.'},
  tap:{t:'삼층석탑',d:'대웅전 앞마당 중심축 위의 석탑. 두 층의 기단 위에 세 층의 탑신과 옥개석을 올리고 꼭대기에 상륜을 얹었다.'},
  deung:{t:'석등 石燈',d:'법당 앞을 밝히는 등. 화사석(火舍石)의 창으로 불빛이 새어 나온다. 황혼으로 바꾸면 불이 켜진다.'},
  daeung:{t:'대웅전 大雄殿',d:'석가모니불을 모신 중심 법당. 정면 5칸, 측면 3칸, 다포식 공포. 가운데 어간문은 닫고 대중이 드나드는 좌우 협칸 문을 열어 두었다. 지붕은 단순화한 형태다.'},
  inside:{t:'대웅전 내부',d:'수미단 위에 본존과 좌우 협시불, 뒤로 후불탱화, 본존 위로 닫집. 앞에 촛대와 향로를 놓은 불단, 바닥에 좌복, 천장은 우물반자에 연등을 달았다.'},
  bell:{t:'범종각 梵鐘閣',d:'범종을 건 누각. 한국 사찰에서는 새벽 예불 전에 28번, 저녁 예불 전에 33번 치는 것이 관례다. 옆에 당목(撞木)을 걸었다.'},
  yosa:{t:'요사채 寮舍',d:'스님들이 거처하고 공양을 준비하는 생활 공간. 법당 동쪽 마당가에 앉혔다.'}
};
const LBL=[{k:'ilju',p:[0,8.4,58],r:20},{k:'cw',p:[0,7.6,32],r:22},{k:'tap',p:[0,10.4,-4],r:18},{k:'deung',p:[0,5,-9.6],r:10},
  {k:'daeung',p:[0,12.4,-20],r:36},{k:'bell',p:[-17,7.4,14],r:16},{k:'yosa',p:[19,7.2,4],r:26}];
const labelsEl=document.getElementById('labels');
LBL.forEach(l=>{const b=document.createElement('button');b.className='lbl';b.textContent=INFO[l.k].t.split(' ')[0];b.addEventListener('click',()=>focusOn(l));labelsEl.appendChild(b);l.el=b;l.v=new T.Vector3(...l.p);});
const iName=document.getElementById('iName'),iText=document.getElementById('iText'),infoEl=document.getElementById('info');let curInfo='';
function setInfo(k){if(k===curInfo)return;curInfo=k;iName.textContent=INFO[k].t;iText.textContent=INFO[k].d;}

/* ---------- camera state ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const S={mode:'orbit',theta:.55,phi:.98,radius:112,target:new T.Vector3(0,2,2),pos:new T.Vector3(0,0,72),yaw:0,pitch:.04,eye:1.6,keys:{},anim:null};
const hint=document.getElementById('hint'),pad=document.getElementById('pad'),modeBtn=document.getElementById('modeBtn'),fade=document.getElementById('fade');
function setMode(m){S.mode=m;const w=m==='walk';modeBtn.setAttribute('aria-pressed',String(w));modeBtn.textContent=w?'둘러보기':'걷기';
  pad.hidden=!w;infoEl.classList.toggle('full',!w);
  hint.textContent=w?'W A S D 이동 · 드래그로 시선 · Shift 달리기':'드래그 회전 · 휠/핀치 확대 · Shift+드래그 이동';}
function free(x,z){const R=.38;if(Math.abs(x)>150||z>160||z<-150)return false;for(const c of colliders)if(x>c.x0-R&&x<c.x1+R&&z>c.z0-R&&z<c.z1+R)return false;return true;}
function moveWalk(sx,fw){const y=S.yaw,dx=-Math.sin(y)*fw+Math.cos(y)*sx,dz=-Math.cos(y)*fw-Math.sin(y)*sx,p=S.pos;
  if(free(p.x+dx,p.z+dz)){p.x+=dx;p.z+=dz;}else if(free(p.x+dx,p.z))p.x+=dx;else if(free(p.x,p.z+dz))p.z+=dz;}
function orbitTo(t,theta,phi,radius){S.anim=null;const to={t:t.clone(),theta,phi,radius};
  if(reduce){S.target.copy(to.t);S.theta=theta;S.phi=phi;S.radius=radius;return;}
  let d=theta-S.theta;d=((d+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  S.anim={k:0,from:{t:S.target.clone(),theta:S.theta,phi:S.phi,radius:S.radius},to:Object.assign(to,{theta:S.theta+d})};}
function walkTo(x,z,yaw,pitch){const go=()=>{S.pos.set(x,0,z);S.yaw=yaw;S.pitch=pitch||0;S.eye=heightAt(x,z)+1.6;setMode('walk');};
  if(reduce||S.mode!=='walk'){go();return;}fade.style.opacity=1;setTimeout(()=>{go();fade.style.opacity=0;},280);}
function focusOn(l){setMode('orbit');orbitTo(new T.Vector3(l.p[0],l.p[1]*.45,l.p[2]),S.theta,1.12,l.r);setInfo(l.k);markView(null);}

const VIEWS=[
  {n:'전경',info:'overview',go:()=>{setMode('orbit');orbitTo(new T.Vector3(0,2,2),.55,.98,112);}},
  {n:'일주문',info:'ilju',go:()=>walkTo(0,72,0,.06)},
  {n:'천왕문',info:'cw',go:()=>walkTo(0,40,0,.04)},
  {n:'마당',info:'tap',go:()=>walkTo(7,10,.3,.12)},
  {n:'대웅전',info:'daeung',go:()=>{setMode('orbit');orbitTo(new T.Vector3(0,5,-19),.42,1.2,34);}},
  {n:'법당 안',info:'inside',go:()=>walkTo(0,-16.2,0,.1)},
  {n:'범종각',info:'bell',go:()=>{setMode('orbit');orbitTo(new T.Vector3(-17,2.6,14),-.7,1.25,15);}}
];
const viewsEl=document.getElementById('views');
VIEWS.forEach((v,i)=>{const b=document.createElement('button');b.className='b';b.textContent=v.n;b.id='v'+i;b.setAttribute('aria-pressed','false');
  b.addEventListener('click',()=>{v.go();setInfo(v.info);markView(i);});viewsEl.appendChild(b);v.el=b;});
function markView(i){VIEWS.forEach((v,j)=>v.el.setAttribute('aria-pressed',String(i===j)));}

modeBtn.addEventListener('click',()=>{markView(null);
  if(S.mode==='orbit'){let x=S.target.x,z=S.target.z;if(!free(x,z)){x=0;z=72;}S.pos.set(x,0,z);S.yaw=S.theta;S.pitch=0;S.eye=heightAt(x,z)+1.6;setMode('walk');}
  else{setMode('orbit');const f=new T.Vector3(-Math.sin(S.yaw),0,-Math.cos(S.yaw));S.target.set(S.pos.x+f.x*8,2,S.pos.z+f.z*8);S.theta=S.yaw;S.phi=1.1;S.radius=26;S.anim=null;}});

/* ---------- time of day ---------- */
let dusk=false;const timeBtn=document.getElementById('timeBtn');
function applyTime(d){dusk=d;timeBtn.setAttribute('aria-pressed',String(d));
  skyU.top.value.set(d?0x27304d:0x6f9ec4);skyU.bot.value.set(d?0xe0936a:0xdde5e1);scene.fog.color.set(d?0x8c6f6a:0xcfd8d6);
  sun.color.set(d?0xff9f66:0xfff1dc);sun.intensity=d?.5:1.0;sun.position.set(d?70:-40,d?22:72,d?20:48);
  hemi.intensity=d?.34:.65;hemi.color.set(d?0x8fa0c8:0xdbe8f0);
  lanternMats.forEach(m=>m.emissiveIntensity=d?1.05:.04);M.glow.emissiveIntensity=d?2:.15;lampLight.intensity=d?1.6:0;
  M.door.emissive.set(d?0x4a2c10:0x000000);M.flame.color.set(d?0xffe09a:0xffd27a);
  const [pl,sp,cl]=window.__inner;pl.intensity=d?1.3:.9;sp.intensity=d?1.7:1.2;cl.intensity=d?.9:.5;}
timeBtn.addEventListener('click',()=>applyTime(!dusk));

/* ---------- input ---------- */
const ptrs=new Map();let pinch=0,panMode=false;
const pd=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});panMode=e.button===2||e.shiftKey;if(ptrs.size===2)pinch=pd();S.anim=null;});
canvas.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const d=pd();if(pinch){if(S.mode==='orbit')S.radius=clamp(S.radius*pinch/d,5,240);else moveWalk(0,(d-pinch)*.03);}pinch=d;return;}
  if(S.mode==='orbit'){if(panMode){const k=S.radius*.0016,t=S.theta;S.target.x+=-Math.cos(t)*dx*k-Math.sin(t)*dy*k;S.target.z+=Math.sin(t)*dx*k-Math.cos(t)*dy*k;}
    else{S.theta-=dx*.006;S.phi=clamp(S.phi-dy*.005,.12,1.5);}}
  else{S.yaw-=dx*.004;S.pitch=clamp(S.pitch-dy*.003,-1.1,1.1);}});
const up=e=>{ptrs.delete(e.pointerId);pinch=0;};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{e.preventDefault();S.anim=null;if(S.mode==='orbit')S.radius=clamp(S.radius*Math.exp(e.deltaY*.001),5,240);else moveWalk(0,-e.deltaY*.01);},{passive:false});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k.startsWith('arrow')||k===' ')e.preventDefault();S.keys[k]=true;S.keys.shift=e.shiftKey;});
addEventListener('keyup',e=>{S.keys[e.key.toLowerCase()]=false;S.keys.shift=e.shiftKey;});
addEventListener('blur',()=>{S.keys={};});
pad.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);S.keys[k]=true;});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{S.keys[k]=false;}));});

/* ---------- loop ---------- */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const clock=new T.Clock(),tmp=new T.Vector3();let zoneT=0;
function frame(){const dt=Math.min(clock.getDelta(),.05),K=S.keys;
  const f=(K.w||K.arrowup?1:0)-(K.s||K.arrowdown?1:0),sx=(K.d?1:0)-(K.a?1:0),turn=(K.arrowleft||K.q?1:0)-(K.arrowright||K.e?1:0);
  if(S.mode==='walk'){S.yaw+=turn*1.7*dt;const sp=(K.shift?8:3.4)*dt;if(f||sx)moveWalk(sx*sp,f*sp);
    S.eye+=(heightAt(S.pos.x,S.pos.z)+1.6-S.eye)*Math.min(1,dt*8);
    camera.position.set(S.pos.x,S.eye,S.pos.z);
    camera.lookAt(S.pos.x-Math.sin(S.yaw)*Math.cos(S.pitch),S.eye+Math.sin(S.pitch),S.pos.z-Math.cos(S.yaw)*Math.cos(S.pitch));
    zoneT-=dt;if(zoneT<=0){zoneT=.3;const p=S.pos;
      if(Math.abs(p.x)<7.5&&p.z<-15.5&&p.z>-24.5)setInfo('inside');
      else{let best=null,bd=14;LBL.forEach(l=>{const d=Math.hypot(l.p[0]-p.x,l.p[2]-p.z);if(d<bd){bd=d;best=l.k;}});if(best)setInfo(best);}}}
  else{if(f||sx||turn){const k=S.radius*.6*dt,t=S.theta;S.target.x+=(-Math.sin(t)*f+Math.cos(t)*sx)*k;S.target.z+=(-Math.cos(t)*f-Math.sin(t)*sx)*k;S.theta-=turn*dt;}
    if(S.anim){const a=S.anim;a.k=Math.min(1,a.k+dt/1.3);const e=a.k<.5?4*a.k*a.k*a.k:1-Math.pow(-2*a.k+2,3)/2;
      S.target.lerpVectors(a.from.t,a.to.t,e);S.theta=a.from.theta+(a.to.theta-a.from.theta)*e;S.phi=a.from.phi+(a.to.phi-a.from.phi)*e;S.radius=a.from.radius+(a.to.radius-a.from.radius)*e;if(a.k>=1)S.anim=null;}
    const sp=Math.sin(S.phi);camera.position.set(S.target.x+S.radius*sp*Math.sin(S.theta),Math.max(S.target.y+S.radius*Math.cos(S.phi),.5),S.target.z+S.radius*sp*Math.cos(S.theta));camera.lookAt(S.target);}
  sky.position.copy(camera.position);
  camera.updateMatrixWorld();const W=innerWidth,H=innerHeight;
  LBL.forEach(l=>{tmp.copy(l.v).project(camera);const vis=S.mode==='orbit'&&tmp.z<1&&Math.abs(tmp.x)<1.05&&Math.abs(tmp.y)<1.05;
    l.el.hidden=!vis;if(vis)l.el.style.transform=`translate(${(tmp.x*.5+.5)*W}px,${(-tmp.y*.5+.5)*H}px) translate(-50%,calc(-100% - 7px))`;});
  renderer.render(scene,camera);requestAnimationFrame(frame);}

applyTime(false);setInfo('overview');markView(0);setMode('orbit');
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){document.fonts.load('700 92px "Noto Serif KR"','一柱門天王門大雄殿梵鐘閣').then(()=>{plaques.forEach(t=>{const g=t._c.getContext('2d');g.clearRect(0,0,t._c.width,t._c.height);t._draw(g,t._c.width,t._c.height);t.needsUpdate=true;});}).catch(()=>{});}
})();
</script>
</body></html>
